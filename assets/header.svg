<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>self-improve: a finished task is reviewed in a fresh session and turned into changes to the agent's setup</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#57606a"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect width="1000" height="300" rx="14" fill="#f6f8fa"/>

  <!-- who acts at each step; boxes at x = 25 + i*162, w = 140 -->
  <g font-size="10.5" font-weight="600" letter-spacing="0.8" text-anchor="middle">
    <text x="95" y="40" fill="#57606a">HARNESS</text>
    <text x="257" y="40" fill="#57606a">HARNESS → MODEL</text>
    <text x="419" y="40" fill="#8250df">MODEL</text>
    <text x="581" y="40" fill="#8250df">MODEL</text>
    <text x="743" y="40" fill="#bc4c00">USER</text>
    <text x="905" y="40" fill="#0f766e">HARNESS FILES</text>
  </g>

  <g fill="#fff" stroke="#d0d7de">
    <rect x="25" y="52" width="140" height="132" rx="9"/>
    <rect x="187" y="52" width="140" height="132" rx="9"/>
    <rect x="349" y="52" width="140" height="132" rx="9"/>
    <rect x="511" y="52" width="140" height="132" rx="9"/>
    <rect x="673" y="52" width="140" height="132" rx="9"/>
  </g>
  <rect x="835" y="52" width="140" height="132" rx="9" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5"/>

  <!-- titles -->
  <g font-size="14" font-weight="600" text-anchor="middle" fill="#1f2328">
    <text x="95" y="80">Past task</text>
    <text x="257" y="80">Fresh session</text>
    <text x="419" y="80">Review</text>
    <text x="581" y="80">Proposals</text>
    <text x="743" y="80">User review</text>
    <text x="905" y="80" fill="#0f766e">Agent setup</text>
  </g>

  <!-- bullets: first line at y=106, 17px apart; wrapped lines indented -->
  <g font-size="12" fill="#57606a">
    <text x="39" y="106">• outputs</text>
    <text x="39" y="123">• session transcript</text>

    <text x="201" y="106">• harness loads</text>
    <text x="211" y="123">SKILL.md</text>

    <text x="363" y="106">• result</text>
    <text x="363" y="123">• claims</text>
    <text x="363" y="140">• process</text>
    <text x="363" y="157">• cost</text>

    <text x="525" y="106">• Model proposes a</text>
    <text x="535" y="123">solution for self-</text>
    <text x="535" y="140">improvement against</text>
    <text x="535" y="157">existing setup</text>

    <text x="687" y="106">• evaluate</text>
    <text x="687" y="123">• approve / reject</text>
    <text x="697" y="140">proposal</text>
  </g>
  <g font-size="12" fill="#1f2328">
    <text x="849" y="106">• rules</text>
    <text x="849" y="123">• skills</text>
    <text x="849" y="140">• scripts</text>
    <text x="849" y="157">• settings</text>
  </g>

  <!-- forward arrows -->
  <g stroke="#57606a" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M167 118H184"/>
    <path d="M329 118H346"/>
    <path d="M491 118H508"/>
    <path d="M653 118H670"/>
    <path d="M815 118H832"/>
  </g>

  <text x="419" y="206" font-size="12" text-anchor="middle" fill="#57606a">project left untouched</text>

  <!-- loop back: setup shapes the next task -->
  <path d="M905 186V238Q905 252 891 252H109Q95 252 95 238V188" stroke="#0f766e" stroke-width="1.8" fill="none" stroke-dasharray="6 5" marker-end="url(#g)"/>
  <text x="500" y="278" font-size="13.5" text-anchor="middle" fill="#0f766e">next task runs on the improved setup</text>
</svg>
