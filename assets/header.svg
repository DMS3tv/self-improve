<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>self-improve: how a finished task becomes changes to the agent's setup</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#57606a"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect width="1000" height="300" rx="14" fill="#f6f8fa"/>

  <text x="34" y="46" font-size="24" font-weight="700" fill="#1f2328">self-improve</text>
  <text x="196" y="46" font-size="15" fill="#57606a">retrospective that improves the agent, not the project · any harness · any model</text>

  <!-- who acts at each step -->
  <g font-size="10.5" font-weight="600" letter-spacing="0.8" text-anchor="middle">
    <text x="100" y="75" fill="#57606a">HARNESS</text>
    <text x="260" y="75" fill="#57606a">HARNESS → MODEL</text>
    <text x="420" y="75" fill="#8250df">MODEL</text>
    <text x="580" y="75" fill="#8250df">MODEL</text>
    <text x="740" y="75" fill="#bc4c00">YOU</text>
    <text x="900" y="75" fill="#0f766e">HARNESS FILES</text>
  </g>

  <!-- boxes: x = 34 + i*160, w = 132 -->
  <g font-size="14" text-anchor="middle">
    <rect x="34" y="84" width="132" height="96" rx="9" fill="#fff" stroke="#d0d7de"/>
    <text x="100" y="114" font-weight="600" fill="#1f2328">Past task</text>
    <text x="100" y="138" font-size="12.5" fill="#57606a">outputs</text>
    <text x="100" y="156" font-size="12.5" fill="#57606a">session transcript</text>

    <rect x="194" y="84" width="132" height="96" rx="9" fill="#fff" stroke="#d0d7de"/>
    <text x="260" y="114" font-weight="600" fill="#1f2328">Fresh session</text>
    <text x="260" y="138" font-size="12.5" fill="#57606a">harness loads</text>
    <text x="260" y="156" font-size="12.5" fill="#57606a">SKILL.md</text>

    <rect x="354" y="84" width="132" height="96" rx="9" fill="#fff" stroke="#d0d7de"/>
    <text x="420" y="114" font-weight="600" fill="#1f2328">Review</text>
    <text x="420" y="138" font-size="12.5" fill="#57606a">result · claims</text>
    <text x="420" y="156" font-size="12.5" fill="#57606a">process · cost</text>

    <rect x="514" y="84" width="132" height="96" rx="9" fill="#fff" stroke="#d0d7de"/>
    <text x="580" y="114" font-weight="600" fill="#1f2328">Proposals</text>
    <text x="580" y="138" font-size="12.5" fill="#57606a">checked against</text>
    <text x="580" y="156" font-size="12.5" fill="#57606a">existing setup</text>

    <rect x="674" y="84" width="132" height="96" rx="9" fill="#fff" stroke="#d0d7de"/>
    <text x="740" y="114" font-weight="600" fill="#1f2328">You pick</text>
    <text x="740" y="138" font-size="12.5" fill="#57606a">reply with</text>
    <text x="740" y="156" font-size="12.5" fill="#57606a">numbers</text>

    <rect x="834" y="84" width="132" height="96" rx="9" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5"/>
    <text x="900" y="114" font-weight="600" fill="#0f766e">Agent setup</text>
    <text x="900" y="138" font-size="12.5" fill="#1f2328">rules · skills</text>
    <text x="900" y="156" font-size="12.5" fill="#1f2328">scripts · settings</text>
  </g>

  <!-- forward arrows -->
  <g stroke="#57606a" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M168 132H191"/>
    <path d="M328 132H351"/>
    <path d="M488 132H511"/>
    <path d="M648 132H671"/>
    <path d="M808 132H831"/>
  </g>

  <!-- loop back: setup shapes the next task -->
  <path d="M900 182V236Q900 250 886 250H114Q100 250 100 236V184" stroke="#0f766e" stroke-width="1.8" fill="none" stroke-dasharray="6 5" marker-end="url(#g)"/>
  <text x="500" y="272" font-size="13.5" text-anchor="middle" fill="#0f766e">next task runs on the improved setup</text>

  <text x="580" y="206" font-size="12" text-anchor="middle" fill="#57606a">no duplicates · conflicts weighed</text>
  <text x="420" y="206" font-size="12" text-anchor="middle" fill="#57606a">project left untouched</text>
</svg>
